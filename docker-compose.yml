version: '3.9'

services:
  web:
    build: .
    container_name: powercore_diagram_parser_app
    restart: always
    command: sh -c "gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:7000 --timeout 300"
    networks:
      - app-network

  nginx:
    build: ./nginx
    container_name: nginx_proxy
    ports:
      - "8000:8000"
    depends_on:
      - web
    networks:
      - app-network
    restart: "on-failure"

networks:
  app-network:
    driver: bridge
